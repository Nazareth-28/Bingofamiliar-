<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo Familiar</title>
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 20px;
      padding: 25px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      color: #f472b6;
      font-size: 2rem;
      margin-bottom: 5px;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-jugador {
      background: linear-gradient(90deg, #ec4899, #8b5cf6);
      color: white;
    }
    .btn-admin {
      background-color: #334155;
      color: #94a3b8;
    }
    .hidden { display: none; }
    
    /* Estilos del Cartón */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th { background-color: #0284c7; color: white; padding: 10px; font-size: 1.2rem; }
    td { background-color: #ffffff; color: #000; padding: 12px; font-weight: bold; border: 1px solid #cbd5e1; }
    td.marcado { background-color: #22c55e; color: white; }
    td.gratis { background-color: #eab308; color: white; }
  </style>
</head>
<body>

  <!-- PANTALLA 1: MENÚ INICIAL -->
  <div id="pantalla-inicio" class="card">
    <h1>Bingo Lineal</h1>
    <p class="subtitle">El sistema oficial en tiempo real con voz cantante</p>
    
    <button class="btn btn-jugador" onclick="irA('pantalla-jugador')">🎮 Entrar como Jugadora</button>
    <button class="btn btn-admin" onclick="irA('pantalla-admin')">🔑 Acceso Administradora</button>
  </div>

  <!-- PANTALLA 2: VISTA DEL JUGADOR -->
  <div id="pantalla-jugador" class="card hidden">
    <h2>¡Bienvenida al Bingo!</h2>
    <p class="subtitle">Selecciona tu número de cartón asignado:</p>
    
    <select id="select-carton" onchange="mostrarCarton(this.value)" style="padding: 8px; border-radius: 8px; width: 100%;">
      <option value="1">Cartón #1</option>
      <option value="2">Cartón #2</option>
    </select>

    <div id="contenedor-carton">
      <!-- Aquí se carga la tabla automáticamente -->
    </div>
    
    <button class="btn btn-admin" onclick="irA('pantalla-inicio')" style="margin-top:200px;">← Volver</button>
  </div>

  <!-- PANTALLA 3: VISTA ADMINISTRADORA -->
  <div id="pantalla-admin" class="card hidden">
    <h2>Panel Administradora</h2>
    <p class="subtitle">Control global de la partida</p>
    <button class="btn btn-jugador" onclick="alert('Cantando número...')">🎲 Sacar / Cantar Bola</button>
    <button class="btn btn-admin" onclick="irA('pantalla-inicio')">← Volver</button>
  </div>

  <script>
    function irA(pantallaId) {
      document.getElementById('pantalla-inicio').classList.add('hidden');
      document.getElementById('pantalla-jugador').classList.add('hidden');
      document.getElementById('pantalla-admin').classList.add('hidden');
      
      document.getElementById(pantallaId).classList.remove('hidden');
    }
  </script>

</body>
</html>
