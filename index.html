   <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo Lineal Vizzio</title>
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e293b;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    h1 { color: #ec4899; margin-bottom: 5px; }
    p { color: #94a3b8; font-size: 14px; margin-top: 0; }
    .btn {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary { background: linear-gradient(90deg, #ec4899, #8b5cf6); color: white; }
    .btn-secondary { background-color: #334155; color: white; }
    .btn:hover { opacity: 0.9; }
    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: white;
      text-align: center;
      font-size: 16px;
    }
    .hidden { display: none; }
    .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 15px; }
    .cell { background: white; color: black; font-weight: bold; padding: 10px; border-radius: 5px; }
    .header-cell { background: #0284c7; color: white; }
    .free-cell { background: #22c55e; color: white; }
  </style>
</head>
<body>

  <!-- PANTALLA PRINCIPAL -->
  <div id="menu-view" class="card">
    <h1>Bingo Lineal</h1>
    <p>El sistema oficial en tiempo real con voz cantante</p>
    <button class="btn btn-primary" onclick="verJugadora()">🎮 Entrar como Jugadora</button>
    <button class="btn btn-secondary" onclick="mostrarLoginAdmin()">🔑 Acceso Administradora</button>
  </div>

  <!-- LOGIN ADMINISTRADOR -->
  <div id="admin-login-view" class="card hidden">
    <h2>Acceso Administradora</h2>
    <p>Ingresa la clave para acceder al panel de control:</p>
    <input type="password" id="admin-pass" placeholder="Contraseña">
    <button class="btn btn-primary" onclick="loginAdmin()">Ingresar</button>
    <button class="btn btn-secondary" onclick="volverMenu()">← Volver al Menú</button>
  </div>

  <!-- VISTA JUGADORA -->
  <div id="player-view" class="card hidden">
    <h2>¡Bienvenida al Bingo!</h2>
    <p>Selecciona tu número de cartón asignado:</p>
    <select id="carton-select" onchange="cargarCarton(this.value)" style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px;">
      <option value="1">Cartón #1</option>
      <option value="2">Cartón #2</option>
    </select>
    
    <div class="board" id="carton-board">
      <div class="cell header-cell">B</div><div class="cell header-cell">I</div><div class="cell header-cell">N</div><div class="cell header-cell">G</div><div class="cell header-cell">O</div>
      <!-- Las celdas se cargan automáticamente -->
    </div>
    <br>
    <button class="btn btn-secondary" onclick="volverMenu()">← Volver al Menú</button>
  </div>

  <!-- VISTA ADMINISTRADORA -->
  <div id="admin-panel-view" class="card hidden">
    <h2>Panel de Administradora</h2>
    <p>Cantar número en tiempo real:</p>
    <input type="number" id="numero-cantar" placeholder="Ej. 15" min="1" max="75">
    <button class="btn btn-primary" onclick="enviarNumero()">📢 Cantar Número</button>
    <button class="btn btn-secondary" onclick="volverMenu()">← Volver al Menú</button>
  </div>

  <!-- LÓGICA JAVASCRIPT & FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA7odiafJgukMu3S3WygWjtnQPbG9AT48U",
      authDomain: "bingofamiliar-f99e0.firebaseapp.com",
      databaseURL: "https://bingofamiliar-f99e0-default-rtdb.firebaseio.com",
      projectId: "bingofamiliar-f99e0",
      storageBucket: "bingofamiliar-f99e0.firebasestorage.app",
      messagingSenderId: "1015749396232",
      appId: "1:1015749396232:web:92e5f8b207eefdc7a98ebd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Escuchar bolas cantadas
    onValue(ref(db, 'partida/ultimaBola'), (snapshot) => {
      const numero = snapshot.val();
      if (numero) {
        alert("¡Nueva bola cantada!: " + numero);
      }
    });

    window.enviarNumero = function() {
      const numInput = document.getElementById('numero-cantar');
      if (numInput.value) {
        set(ref(db, 'partida/ultimaBola'), numInput.value);
        alert("Número cantado: " + numInput.value);
        numInput.value = '';
      }
    };
  </script>

  <script>
    function ocultarVistas() {
      document.getElementById('menu-view').classList.add('hidden');
      document.getElementById('admin-login-view').classList.add('hidden');
      document.getElementById('player-view').classList.add('hidden');
      document.getElementById('admin-panel-view').classList.add('hidden');
    }

    function volverMenu() {
      ocultarVistas();
      document.getElementById('menu-view').classList.remove('hidden');
    }

    function verJugadora() {
      ocultarVistas();
      document.getElementById('player-view').classList.remove('hidden');
    }

    function mostrarLoginAdmin() {
      ocultarVistas();
      document.getElementById('admin-login-view').classList.remove('hidden');
    }

    function loginAdmin() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === "1234") { // Puedes cambiar esta contraseña si gustas
        ocultarVistas();
        document.getElementById('admin-panel-view').classList.remove('hidden');
      } else {
        alert("Contraseña incorrecta");
      }
    }
  </script>
</body>
</html>
