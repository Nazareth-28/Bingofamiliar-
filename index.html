<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Familiar - Panel Administradora</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 15px;
        }

        .main-container {
            width: 100%;
            max-width: 450px;
        }

        .title {
            color: #ec4899;
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .subtitle {
            color: #94a3b8;
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .admin-panel {
            background: #161b22;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 1px solid #30363d;
        }

        h2 {
            color: #f59e0b;
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        /* CARD DE JUGADORES EN VIVO */
        .card-section {
            background: #0d1117;
            border: 1px solid #e11d48;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #ec4899;
            margin-bottom: 10px;
        }

        .status-live {
            color: #10b981;
            font-size: 0.85rem;
        }

        .lista-conectados {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .jugador-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #21262d;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .jugador-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .jugador-control {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        /* FRANJA AZUL: ESPERANDO 1 BOLA */
        .jugador-esperando {
            background: linear-gradient(90deg, #0284c7 0%, #0369a1 100%) !important;
            border: 1.5px solid #38bdf8 !important;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .texto-espera {
            color: #7dd3fc;
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* BOLA ACTUAL Y CONTADOR DE BOLAS */
        .bola-section {
            text-align: center;
        }

        .bolas-contador {
            color: #c084fc;
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 10px;
        }

        .bola-display-container {
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .bola-gigante {
            width: 85px;
            height: 85px;
            background: radial-gradient(circle at 30% 30%, #facc15, #ca8a04);
            border-radius: 50%;
            color: #000000;
            font-size: 2.2rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.4);
        }

        .ultimas-salidas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ultimas-title {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .ultimas-bolas {
            display: flex;
            gap: 6px;
        }

        .mini-bola {
            width: 34px;
            height: 34px;
            background: #8b5cf6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
        }

        /* CONTROLES Y BOTONES */
        .grid-2-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #ffffff;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:active {
            opacity: 0.8;
        }

        .full-width {
            width: 100%;
            margin-bottom: 12px;
        }

        .btn-primary { background: #8b5cf6; }
        .btn-warning { background: #f97316; }
        .btn-secondary { background: #21262d; border: 1px solid #30363d; }
        .btn-purple { background: #a855f7; }
        .btn-success { background: #10b981; }
        .btn-danger { background: #ef4444; }

        .control-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .select-custom {
            background: #0d1117;
            color: #ffffff;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .sub-title-section {
            color: #f59e0b;
            font-size: 0.95rem;
            margin: 15px 0 10px 0;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1 class="title">Bingo Familiar</h1>
        <p class="subtitle">El sistema oficial en tiempo real con voz cantante</p>

        <div class="admin-panel">
            <h2>👑 Panel Administradora</h2>

            <!-- JUGADORES EN VIVO CON AVISO DE ESPERANDO 1 BOLA -->
            <div class="card-section">
                <div class="section-header">
                    <span>👥 Conectados en Vivo (<span id="cant-conectados">0</span>)</span>
                    <span class="status-live">• En Vivo</span>
                </div>
                <div id="lista-conectados" class="lista-conectados">
                    <!-- Se renderiza con JavaScript -->
                </div>
            </div>

            <!-- BOTÓN SONIDO -->
            <button id="btn-sonido" class="btn-secondary full-width">🔊 Sonido: ON</button>

            <!-- BOLA ACTUAL EN JUEGO Y CONTADOR -->
            <div class="card-section bola-section">
                <div class="bolas-contador">
                    ⚡ Bolas Cantadas: <span id="contador-bolas">0</span>
                </div>

                <div class="bola-display-container">
                    <div id="bola-actual" class="bola-gigante">--</div>
                    <div class="ultimas-salidas-container">
                        <span class="ultimas-title">Últimas salidas:</span>
                        <div id="ultimas-bolas" class="ultimas-bolas">
                            <span class="mini-bola">--</span>
                            <span class="mini-bola">--</span>
                            <span class="mini-bola">--</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CONTROLES -->
            <div class="grid-2-cols">
                <button id="btn-cantar" class="btn-primary">🎲 Cantar Bola</button>
                <button id="btn-pausar" class="btn-warning">⏸ Pausar Auto</button>
            </div>

            <div class="control-group">
                <label for="select-velocidad">⚡ Velocidad:</label>
                <select id="select-velocidad" class="select-custom">
                    <option value="4000">Normal (4 seg)</option>
                    <option value="3000">Rápido (3 seg)</option>
                    <option value="5000">Lento (5 seg)</option>
                </select>
            </div>

            <button id="btn-ver-bingo" class="btn-purple full-width">🏆 Ver Último Bingo</button>

            <div class="control-group">
                <label for="select-figura">Figura Actual:</label>
                <select id="select-figura" class="select-custom">
                    <option value="lleno">Cartón Lleno (Apagón)</option>
                    <option value="4esquinas">4 Esquinas</option>
                    <option value="linea">Línea Horizontal</option>
                    <option value="x">La X</option>
                    <option value="cruz">La Cruz</option>
                </select>
            </div>

            <!-- REINICIOS -->
            <button id="btn-nueva-partida" class="btn-success full-width">🔄 Nueva Partida (Mantener Cartones)</button>
            <button id="btn-reiniciar-todo" class="btn-danger full-width">⚠️ Reiniciar Todo (Borrar Cartones)</button>

            <h3 class="sub-title-section">Cartones Vendidos y Estado de Pago:</h3>
            <div id="lista-cartones-vendidos" class="lista-cartones">
                <!-- Estado de cartones -->
            </div>
        </div>
    </div>

    <script>
        // ESTADO GLOBAL DEL JUEGO
        let juego = {
            bolasCantadas: [],
            bolasRestantes: Array.from({ length: 75 }, (_, i) => i + 1),
            // Ejemplo de conectados con detección de bolas faltantes
            conectados: [
                { id: 1, nombre: "Ainoa", control: "123", faltantes: 3 },
                { id: 2, nombre: "Carmen", control: "123", faltantes: 1 }, // Simulación: Esperando 1 bola
                { id: 3, nombre: "Mariangelys", control: "123", faltantes: 4 },
                { id: 4, nombre: "Maribel", control: "2", faltantes: 1 }    // Simulación: Esperando 1 bola
            ]
        };

        // ELEMENTOS DEL DOM
        const elContadorBolas = document.getElementById('contador-bolas');
        const elBolaActual = document.getElementById('bola-actual');
        const elUltimasBolas = document.getElementById('ultimas-bolas');
        const elListaConectados = document.getElementById('lista-conectados');
        const elCantConectados = document.getElementById('cant-conectados');

        const btnCantar = document.getElementById('btn-cantar');
        const btnNuevaPartida = document.getElementById('btn-nueva-partida');
        const btnReiniciarTodo = document.getElementById('btn-reiniciar-todo');

        // DIBUJAR LISTA DE JUGADORES (CON FRANJA AZUL SI ESPERAN 1 BOLA)
        function renderizarConectados() {
            elListaConectados.innerHTML = '';
            elCantConectados.innerText = juego.conectados.length;

            juego.conectados.forEach((jugador, index) => {
                const estaEsperando = jugador.faltantes === 1;

                const card = document.createElement('div');
                card.className = `jugador-card ${estaEsperando ? 'jugador-esperando' : ''}`;

                const textoEspera = estaEsperando ? ' <span class="texto-espera">(esperando 1 bola!)</span>' : '';

                card.innerHTML = `
                    <div class="jugador-info">
                        <span>${index + 1}. ${jugador.nombre}</span>${textoEspera}
                    </div>
                    <div class="jugador-control">Control: ${jugador.control}</div>
                `;

                elListaConectados.appendChild(card);
            });
        }

        // CANTAR BOLA Y ENUMERAR CANTIDAD QUE VAN
        function cantarBola() {
            if (juego.bolasRestantes.length === 0) {
                alert("¡Ya se han cantado todas las bolas!");
                return;
            }

            const indexRandom = Math.floor(Math.random() * juego.bolasRestantes.length);
            const bola = juego.bolasRestantes.splice(indexRandom, 1)[0];
            
            juego.bolasCantadas.unshift(bola);

            actualizarPantallaBolas();
        }

        // ACTUALIZAR CONTADOR Y BOLAS PANTALLA
        function actualizarPantallaBolas() {
            // Actualizar total de bolas que van saliendo
            elContadorBolas.innerText = juego.bolasCantadas.length;

            // Bola Gigante Actual
            if (juego.bolasCantadas.length > 0) {
                elBolaActual.innerText = juego.bolasCantadas[0];
            } else {
                elBolaActual.innerText = '--';
            }

            // Últimas 3 salidas
            const ultimas = juego.bolasCantadas.slice(1, 4);
            elUltimasBolas.innerHTML = '';

            for (let i = 0; i < 3; i++) {
                const span = document.createElement('span');
                span.className = 'mini-bola';
                span.innerText = ultimas[i] !== undefined ? ultimas[i] : '--';
                elUltimasBolas.appendChild(span);
            }
        }

        // REINICIAR CONTADORES EN NUEVA PARTIDA
        function nuevaPartida() {
            juego.bolasCantadas = [];
            juego.bolasRestantes = Array.from({ length: 75 }, (_, i) => i + 1);
            actualizarPantallaBolas();
        }

        // EVENTOS
        btnCantar.addEventListener('click', cantarBola);
        btnNuevaPartida.addEventListener('click', nuevaPartida);
        btnReiniciarTodo.addEventListener('click', () => {
            nuevaPartida();
            alert("Partida y sistema reiniciados.");
        });

        // INICIALIZAR
        renderizarConectados();
        actualizarPantallaBolas();
    </script>
</body>
</html>
